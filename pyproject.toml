[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sony-arw-decoder"
version = "0.1.0"
description = "Standalone Sony ARW RAW decoder with Rust CPU and Apple Metal GPU backends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "sony-arw-decoder contributors" },
]
keywords = ["sony", "arw", "raw", "photography", "metal", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.26",
    "rawpy>=0.19",
    "tifffile>=2023.7",
    "Pillow>=10.0",
]

[project.scripts]
sony-decode = "sony_arw_decoder.cli:decode_main"
sony-batch = "sony_arw_decoder.cli:batch_main"

[tool.setuptools]
packages = ["sony_arw_decoder"]
include-package-data = true
