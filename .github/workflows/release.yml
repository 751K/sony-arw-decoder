name: Build and Release Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            env:
              MACOSX_DEPLOYMENT_TARGET: "13.0"
          - name: linux-x86_64
            os: ubuntu-22.04
            env: {}
          - name: windows-x86_64
            os: windows-latest
            env: {}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: python -m pip install --upgrade pip build "setuptools>=77" wheel

      - name: Build platform wheel
        env: ${{ matrix.env }}
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Verify wheel installation and CLI smoke test
        shell: bash
        run: |
          python -m venv .verify-venv
          if [ -f .verify-venv/bin/python ]; then
            PY="$(pwd)/.verify-venv/bin/python"
            DECODE="$(pwd)/.verify-venv/bin/sony-decode"
          else
            PY="$(pwd)/.verify-venv/Scripts/python.exe"
            DECODE="$(pwd)/.verify-venv/Scripts/sony-decode.exe"
          fi
          "$PY" -m pip install dist/*.whl
          ARW="$(pwd)/chart/SonyChart.ARW"
          (cd .verify-venv && "$DECODE" "$ARW" --rust --out smoke.jpg && test -s smoke.jpg)
          rm -rf .verify-venv

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
